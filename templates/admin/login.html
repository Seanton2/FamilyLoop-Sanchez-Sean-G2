{% extends "admin/login.html" %}

{% block title %}FamilyLoop Admin Login{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --primary: #2e7d6b;
        --secondary: #1f5246;
        --button-bg: #2e7d6b;
        --button-hover-bg: #1f5246;
        --default-button-bg: #2e7d6b;
        --default-button-hover-bg: #1f5246;
        --link-fg: #2e7d6b;
        --link-hover-color: #1f5246;
    }
    body.login { background: #f1f7f5; }
    .login #header { background: #2e7d6b; }
    .login #container { border-radius: 12px; overflow: hidden; }
    .login .submit-row input { border-radius: 8px; }
    .admin-welcome { text-align: center; margin: 0 0 16px; color: #555; }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">FamilyLoop Admin</div>
{% endblock %}

{% block content_title %}
<p class="admin-welcome">Developer access only.<br>Family members log in <a href="{% url 'login' %}">here</a>.</p>
{% endblock %}
