{% extends 'base.html' %}

{% block title %}Edit Profile | FamilyLoop{% endblock %}

{% block content %}
<div class="card narrow">
    <h2>Edit Profile</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'accounts/_form_fields.html' %}
        <button type="submit" class="btn">Save changes</button>
        <a href="{% url 'profile' %}">Cancel</a>
    </form>
</div>
{% endblock %}
