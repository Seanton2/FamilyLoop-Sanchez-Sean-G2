{% extends 'base.html' %}

{% block title %}{{ heading }} | FamilyLoop{% endblock %}

{% block content %}
<div class="card narrow">
    <h2>{{ heading }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'accounts/_form_fields.html' %}
        <button type="submit" class="btn">{{ button }}</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</div>
{% endblock %}
